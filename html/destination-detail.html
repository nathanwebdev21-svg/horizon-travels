<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css"/>
  <title>Destination Details</title>
</head>

<body id="detail-page-body">
  <section class="detail-hero">
    
    <img id="detail-image" src="" alt="" />

    <h1><span class="detail-title"></span>, <span id="detail-country"></span></h1>
    <p id="tagline"></p>
    </section>
    
    <section class="detail-stats">
    
    <div class="detail-rate">
    <p id="detail-stars"></p>
    <p id="detail-rating"></p>
    </div>
    
    <p id="detail-duration"></p>
    <p>From <span id="detail-price"></span></p>

    </section>
    
    <section class="detail-table">
      
      <div class="detail-table-1">
        <h2>About <span class="detail-title"></span></h2>
        
        <p id="detail-description"></p>
      </div>
    </section>
    
    <section class="detail-highlights">
     <h2>Highlights</h2> 
      <ul class="detail-highlights-list">
        <!-- highlights li -->
      </ul> 
    </section>
    
    <section class="detail-actions">
      <a class="detail-book-btn" href="">Book This Trip</a>
    </section>
    
  
</body>

<script src="../js/destination-detail.js" type="text/javascript" charset="utf-8">
</script>
</html>
